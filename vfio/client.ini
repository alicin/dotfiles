; Looking Glass client — HOST side. Deploy to ~/.config/looking-glass/client.ini
; Tuned for lowest latency on the Intel Arc iGPU under Hyprland/Wayland.
;
; REQUIRED on the Hyprland side (or egl:vsync=no does nothing — frames just queue):
;   general { allow_tearing = true }
;   windowrulev2 = immediate, class:^(looking-glass-client)$
; Run the client fullscreen on eDP-1 (the 2560x1600@240 output).

[app]
renderer=EGL
; Matches the native <shmem name='looking-glass'> ivshmem device in win11.xml.
; (Optional kvmfr upgrade: switch this to /dev/kvmfr0 and re-back the <shmem> — see README.)
shmFile=/dev/shm/looking-glass

[egl]
vsync=no
noBufferAge=yes

[win]
; jitRender times each render to just before vblank using compositor frame
; callbacks. On Hyprland those callbacks stall when the desktop is idle (no
; pointer/UI activity), so the client stops rendering guest frames until you move
; the mouse -> stutter/freeze when idle. Rendering frames as they arrive instead
; (jitRender=no) decouples the client from that callback pacing.
jitRender=no
fullScreen=yes
showFPS=no        ; flip to yes while measuring latency, then back

[input]
; evdev owns the real mouse/keyboard, so the LG window itself doesn't grab input.
grabKeyboard=no
rawMouse=yes

[spice]
; kept for clipboard + native audio (Looking Glass audio rides SPICE)
enable=yes
audio=yes

[wayland]
warpSupport=yes
