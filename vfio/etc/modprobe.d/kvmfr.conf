# KVMFR shared-memory region for Looking Glass.
# 128 MiB covers 2560x1600 SDR with headroom (per-frame = w*h*4*2 + overhead, round to 2^n).
# Only used if you switch to the optional kvmfr path (default is native <shmem> on /dev/shm).
# If you do, this MUST match the <shmem> <size> in win11.xml (128 MiB = 134217728 bytes).
options kvmfr static_size_mb=128
