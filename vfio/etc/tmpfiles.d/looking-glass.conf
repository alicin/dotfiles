# Looking Glass shared-memory buffer (ivshmem-plain host file).
#
# Pre-create /dev/shm/looking-glass on every boot with owner ali:kvm and mode 0660 so:
#   * QEMU (runs as root) can write the captured frames into it, and
#   * the looking-glass-client (runs as ali) can read them.
# Without this the file is created root:root on first VM start and the client can't open it.
# /dev/shm is tmpfs (cleared on reboot), which is why this must run each boot.
#
# Type Path                    Mode UID GID Age Argument
f      /dev/shm/looking-glass   0660 ali kvm -
