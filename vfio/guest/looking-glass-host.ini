; Looking Glass HOST app — GUEST (Windows) side.
; Place next to looking-glass-host.exe (e.g. C:\Program Files\Looking Glass (host)\looking-glass-host.ini)
; and install the host as a SYSTEM service so capture runs at the login screen.
;
; DXGI Desktop Duplication + the B7 D3D12 copy backend = lowest-latency path on a GeForce
; guest (NvFBC is pro-GPU only and NOT available on Blackwell GeForce — do not attempt it).

[app]
capture=dxgi

[dxgi]
copyBackend=d3d12
d3d12CopyDevice=1
disableDamage=no
dwmFlush=no
